name: Deploy to VPS

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy course site
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Copy site to VPS
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ ! "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] ||
             [[ ! "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] ||
             [[ ! "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] ||
             (( 10#$VPS_PORT < 1 || 10#$VPS_PORT > 65535 )) ||
             [[ ! "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] ||
             [[ "$VPS_DEPLOY_PATH" == *..* ]] ||
             [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "Missing or invalid production deployment variables or secrets." >&2
            exit 1
          fi

          deploy_path="${VPS_DEPLOY_PATH%/}"
          if [[ ! "$deploy_path" =~ ^/([A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*$ ]]; then
            echo "VPS_DEPLOY_PATH must be a non-root path with ordinary directory names." >&2
            exit 1
          fi

          umask 077
          key_file="$RUNNER_TEMP/vps_deploy_key"
          known_hosts_file="$RUNNER_TEMP/vps_known_hosts"
          trap 'rm -f -- "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"

          ssh_options=(
            -F /dev/null
            -i "$key_file"
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$known_hosts_file"
            -o GlobalKnownHostsFile=/dev/null
          )
          target="$VPS_USER@$VPS_HOST"
          ssh "${ssh_options[@]}" "$target" \
            "test -d '$deploy_path' && test -w '$deploy_path'"

          rsync -rtp --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -F /dev/null -i '$key_file' -p $VPS_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o 'UserKnownHostsFile=$known_hosts_file' -o GlobalKnownHostsFile=/dev/null" \
            -- course-index.php aws-devops-kurssi.html \
            aws-devops-kurssi-selkeytetty.html terraform-opetusmateriaali.html \
            LICENSE LICENSE-CC-BY-4.0.txt css \
            "$target:$deploy_path/"
